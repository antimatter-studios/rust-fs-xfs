[package]
name = "rust-fs-xfs"
version = "0.12.0"
edition = "2021"
license = "MIT"
description = "Pure-Rust XFS filesystem driver. Exposes a C ABI (fs_xfs_*) suitable for FFI from C/C++/Swift/Go."
repository = "https://github.com/antimatter-studios/rust-fs-xfs"
# The fuzz crate is its own package, on its own toolchain, and is not
# part of this one. Without this, `cargo package` and `cargo publish`
# try to include it and fail on the nightly-only dependency.
exclude = ["fuzz"]

# What the release tarball ships, read by rust-fs-core's
# scripts/package-cli.sh (run as `../rust-fs-core/scripts/package-cli.sh`): every
# dotted name the binary answers to, with its man section, and the licence
# files at the root. CAVEATS is the default, packaging/CAVEATS. The binary
# lists its names itself (`rust-fs-xfs generate names`), and the two must
# agree.
[package.metadata.package-cli]
names = { "fs.xfs" = 1, "mkfs.xfs" = 8, "fsck.xfs" = 8 }
licenses = ["LICENSE"]

# The name this crate had on crates.io: the semver check's baseline until
# a release exists under the new one (rust-fs-core's semver-check.sh).
[package.metadata.semver]
former-name = "am-fs-xfs"

[lib]
name = "fs_xfs"
crate-type = ["staticlib", "rlib"]

# The command-line tools: one multi-call binary, named for the repository,
# which answers to each dotted name (`fs.xfs`) it is linked as. Cargo
# refuses a dot in a target name, so the dotted names are symlinks made
# when the tools are staged (scripts/cli-install.sh) or packaged
# (rust-fs-core's package-cli, run in place), never targets
# of their own.
#
# REQUIRED-FEATURES, so a build of the library -- the static library a
# consumer links -- compiles none of it and gains no dependency: the
# argument parser is optional and only the `cli` feature turns it on.
[[bin]]
name = "rust-fs-xfs"
path = "src/cli/main.rs"
required-features = ["cli"]

[features]
# The command-line tools and nothing else. The plumbing they share --
# dispatch, --version, doctor, the output contract, man pages and
# completions -- is rust-fs-core's `cli` feature, turned on only here, so
# the static library gains nothing. clap is MIT/Apache-2.0.
cli = ["dep:clap", "rust-fs-core/cli"]

[dependencies]
# CRC32C (Castagnoli) protects every v5 metadata block. Apache-2.0.
crc32c = "0.6"
# Block-device trait surface shared with the sister fs-* drivers and the
# img-* disk-image readers.
rust-fs-core = { path = "../rust-fs-core", version = "0.3.3" }
# The command-line tools' argument parser, behind `cli` (see the
# `rust-fs-xfs` target above). No derive: the builder API keeps each
# tool's command a function the man pages and completions can be made from.
clap = { version = "4.5", optional = true, default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }

[dev-dependencies]
# Test-only. The write oracle compares a whole file against the hash the
# Linux kernel computes for it, so both sides have to agree on SHA-256.
# MIT OR Apache-2.0, and it never reaches a consumer of this crate.
sha2 = "0.10"
# YAML parser for tests/ci_profile.rs, which reads .github/workflows/ci.yml
# and refuses if the debug run that lets the PR gate see an arithmetic
# overflow has been removed or disabled. That guard hand-rolled its own
# scanner and needed five separate patches -- comments, quoted keys,
# block scalar styles, indentation, whole trigger names -- each of them
# a rule a YAML parser already has. Pure Rust, YAML 1.2 (so GitHub's
# `on:` key stays the string `on` and is not folded into a boolean),
# MIT/Apache-2.0, and no C to transpile -- unlike serde_yaml, which is
# deprecated and wraps unsafe-libyaml. Test-only, like sha2 above: it
# never reaches a consumer of this crate.
saphyr = "0.0.12"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "unwind"  # required for catch_unwind at the FFI boundary

[profile.dev]
opt-level = 1
panic = "unwind"
