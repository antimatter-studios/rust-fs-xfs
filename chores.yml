version: "3"
chore_min_version: 0.6.0

# THE CONTRACT THIS FILE EXISTS TO OWN.
#
# How to build rust-fs-xfs is knowledge that belongs to rust-fs-xfs. It used to
# live in diskjockey/scripts/build-fs-*.sh — four scripts, 757 lines between
# them, byte-identical once you normalise the driver name, of which three
# lines per script were actually about the filesystem: the cargo invocation,
# the header name and the archive name.
#
# `staticlib` is the whole interface a consumer needs, AND IT TAKES NO
# OUTPUT DIRECTORY. It builds into this crate's own dist/; `chore artifact`
# prints the absolute path of that DIRECTORY, and a consumer copies its
# contents. Nothing outside this repo should know the target triple, the
# cargo profile, or where cargo puts things — and nothing outside it
# chooses where the output lands.
#
# `artifact` PRINTS A DIRECTORY, NOT A FILE. That is the one place this
# differs from rust-blk-probe, whose single binary lets its `artifact` name
# a file: this crate produces libfs_xfs.a AND the headers beside it, so
# there is no single path to name.
vars:
  TRIPLE: aarch64-apple-darwin
  LIBNAME: fs_xfs

# The safety net for a leaked VM.
#
# `defer:` is the primary teardown and stays it: it runs once per task,
# it is positional so it only registers if the thing it tears down was
# actually reached, and a `defer:` that fails FAILS AN OTHERWISE-GREEN
# TASK — which is what makes a machine that would not stop impossible
# to miss.
#
# What `defer:` cannot cover is a path that never reached it. A bare
# `cargo test` boots the machine — several suites shell out to
# scripts/vm.sh — with chore not involved at all. A run killed outright
# (SIGKILL, a background job reaped by its harness) never unwinds
# anything, in chore or in a shell trap. Both happened here in one
# afternoon.
#
# `after_all` runs once per invocation, on success, on failure and on
# Ctrl-C, so any LATER chore invocation of any task cleans up what was
# left behind. `chore build` is enough.
#
# It fails SOFT, and that is the right shape for a net rather than a
# shortcoming: chore prints an after_all failure without failing the
# run. Turning an unrelated `chore build` red because something else
# left a VM running would teach people to ignore it. The loud failure
# stays on `defer:`, where it belongs.
#
# `vm.sh reap` probes with a process check, not `vagrant status`: ~20ms
# against ~1s. That is what makes it affordable on every task rather
# than wired into the few that use the VM — the objection that kept it
# out before.
lifecycle:
  after_all:
    - ./scripts/vm.sh reap

tasks:
  staticlib:
    desc: Build the static library and its headers into this crate's dist/
    # NO `out` ARGUMENT, deliberately. A library does not write into its
    # consumer. It builds into its own dist/ and a consumer asks where that
    # is — `chore artifact` prints the path. Inverting it that way means this
    # crate can change its output layout without every consumer knowing, and
    # it stays independently usable with no consumer at all.
    vars:
      OUT: 'dist'

    # Freshness, replacing the 101 lines of stamp-file and mtime comparison
    # the old scripts carried. Content checksums, so touching a file does not
    # trigger a rebuild and reverting one does not hide behind a newer mtime.
    #
    # These patterns are LITERAL on purpose. chore records a fingerprint by
    # calling fingerprint.Save WITHOUT a renderer (internal/run/run.go:313),
    # so a pattern containing {{ }} is expanded against the raw text, matches
    # nothing, and stores the empty-set hash — the task then never registers
    # as up to date. Measured 2026-08-27 against chore 0.6.0.
    sources:
      - Cargo.toml
      - 'src/**/*.rs'
      - 'include/*.h'
      # fs_core.h is a source of ours because we ship it (see the cp below).
      # THIS PATH AND THE cp MUST AGREE, and nothing checks that they do —
      # it is the same path Cargo.toml resolves am-fs-core from.
      - '../rust-fs-core/include/fs_core.h'

    # Templated, which is fine here where it is not fine above: the check
    # renders these correctly, and every entry is an exact path rather than a
    # glob, so a missing artifact is caught by the pattern failing to match.
    generates:
      - '{{.OUT}}/lib{{.LIBNAME}}.a'
      - '{{.OUT}}/include/{{.LIBNAME}}.h'

    cmds:
      # Idempotent, and it replaces a 25-line "is the target installed" dance:
      # rustup answers "up to date" without touching the network when it is.
      # It runs here rather than in the consumer because the triple is ours.
      - 'rustup target add {{.TRIPLE}}'
      - 'cargo build --release --target {{.TRIPLE}}'
      - 'mkdir -p "{{.OUT}}/include"'
      - 'cp target/{{.TRIPLE}}/release/lib{{.LIBNAME}}.a "{{.OUT}}/lib{{.LIBNAME}}.a"'
      - 'cp include/{{.LIBNAME}}.h "{{.OUT}}/include/{{.LIBNAME}}.h"'
      # Shipping fs_core.h is ours: the header we emit #includes it, so a
      # consumer handed only fs_xfs.h cannot compile.
      - 'cp "../rust-fs-core/include/fs_core.h" "{{.OUT}}/include/fs_core.h"'

  build:
    desc: Debug build
    cmds: ['cargo build']

  test:
    desc: Test suite
    # The VM comes down afterwards, and that is the point of doing this
    # through chore rather than through cargo directly.
    #
    # Most of the suite's real evidence comes from the oracle VM: the
    # tests shell out to scripts/vm.sh, which boots it on demand. Nothing
    # brought it back down. Several were left running at once — QEMU
    # processes idling, and a VM disk that had grown to 4.7 GB.
    #
    # `defer:` runs when the task finishes whether it PASSED OR FAILED,
    # and it runs on interrupt too: PATTERNS.md — "Ctrl-C on a task that
    # brought a topology up still tears it down, on a bounded budget".
    # That is the property that matters. Every leak here was either a
    # failure path or someone moving on to the next thing, and neither is
    # fixed by remembering.
    #
    # `defer:` here rather than relying on the `lifecycle: after_all`
    # reaper at the top of this file, because the two are for different
    # things. This one is the teardown: it belongs to the task that
    # booted the machine, and it FAILS THE TASK if the machine will not
    # stop. The reaper is a net for the paths no defer can reach, and it
    # fails soft. Having both is the point; either alone leaves a hole.
    cmds:
      - defer: ./scripts/vm.sh down
      - cargo test

  lint:
    desc: Formatting and clippy, as CI runs them
    cmds:
      - cargo fmt --check
      - cargo clippy --all-targets -- -D warnings

  vm:up:
    desc: Boot the oracle VM and keep it up until `chore vm:down`
    # `hold` marks the machine as deliberately left running, so the
    # after_all reaper leaves it alone. Without it this task would boot
    # a VM and the lifecycle hook would stop it again on the way out —
    # the one case where an unconditional net is wrong.
    cmds:
      - './scripts/vm.sh up'
      - './scripts/vm.sh hold'

  vm:down:
    desc: Halt the oracle VM, keeping its disk image
    cmds: ['./scripts/vm.sh down']

  vm:status:
    desc: Say whether the oracle VM is running
    # "Is anything still up?" had no answer short of reading `ps` for a
    # qemu command line. Every leak was found that way, after the fact.
    cmds: ['./scripts/vm.sh status']

  vm:destroy:
    desc: Destroy the oracle VM, reclaiming its disk image (~4.7 GB)
    # Halting keeps the image and a re-boot is quick; destroying reclaims
    # the space and the next run pays a full provision (~3 minutes). The
    # choice is a disk-versus-time one, so it is two tasks rather than a
    # flag with a default that would be wrong half the time.
    cmds: ['./scripts/vm.sh destroy']

  fixtures:
    desc: 'Build test fixtures: chore fixtures [--set geometry|data|log|stress|truncate|create|unlink|dirconv|all]'
    args:
      - name: set
        desc: which set to build; every set by default
    vars:
      set: all
    # Same reasoning as `test`. Building fixtures is the other thing that
    # boots the VM, and it is the one that runs longest unattended.
    cmds:
      - defer: ./scripts/vm.sh down
      - |
        set -euo pipefail
        # One boot for the whole run, one teardown at the end.
        #
        # Each wrapper now tears the machine down when it finishes, which
        # is right when it is run on its own and wrong seven in a row:
        # build, halt, boot, build, halt, boot. KEEP_VM tells them to
        # leave it up. The `defer:` above is what brings it down — once,
        # whether this succeeded or failed, and chore fails the task if
        # that teardown fails.
        export KEEP_VM=1
        ./scripts/vm.sh up
        run() {
          echo "==> $1"
          "./scripts/$1"
        }
        case "{{.set}}" in
          geometry) run vm-build-fixtures.sh ;;
          data)     run vm-build-data-fixtures.sh ;;
          log)      run vm-build-log-fixtures.sh ;;
          stress)   run vm-build-stress-fixtures.sh ;;
          truncate) run vm-build-truncate-fixtures.sh ;;
          create)   run vm-build-create-fixtures.sh ;;
          unlink)   run vm-build-unlink-fixtures.sh ;;
          dirconv)  run vm-build-dirconv-fixtures.sh ;;
          all)
            # `stress` is NOT in this list. Saying so out loud because a
            # set that is quietly skipped by the catch-all is the same
            # shape of problem as an oracle that skips: `all` that is not
            # all should say which.
            echo "note: the 'stress' set is not part of 'all' — build it with --set stress" >&2
            # Geometry and data first: several suites read those, and the
            # rest are independent of each other.
            run vm-build-fixtures.sh
            run vm-build-data-fixtures.sh
            run vm-build-log-fixtures.sh
            run vm-build-truncate-fixtures.sh
            run vm-build-create-fixtures.sh
            run vm-build-unlink-fixtures.sh
            run vm-build-dirconv-fixtures.sh
            ;;
          *)
            echo "unknown set '{{.set}}' — one of: geometry data log stress truncate create unlink dirconv all" >&2
            exit 2
            ;;
        esac

  fixtures:clean:
    desc: Remove the built fixtures (they are regenerable, and large)
    cmds: ['rm -rf .vm-share/*.img .vm-share/*.dump .vm-share/*.manifest']

  clean:
    desc: Remove this crate's cargo output
    cmds: ['cargo clean']

  artifact:
    desc: Print the absolute path of the directory holding the built outputs
    # `silent: true` is what makes this usable as a VALUE — without it chore
    # echoes each command and a caller capturing stdout gets the echo too.
    # PATTERNS.md: "a value — a flag string, a container status, a path" is a
    # task called through {{.CHORE_EXE}}.
    silent: true
    # NO `deps: [staticlib]`. chore prints "task: staticlib is up to date" on
    # STDOUT, which a caller capturing this as a value receives as PART OF THE
    # VALUE — measured on rust-blk-probe, where the capture came back as two
    # lines and the caller's path check failed. A value-returning task returns
    # a value and does nothing else; the caller builds first, then asks. Two
    # calls, on purpose.
    #
    # IT PRINTS A DIRECTORY, NOT A FILE, and that is the one place this differs
    # from rust-blk-probe's `artifact`. That crate produces a single binary, so
    # it can name a file. This one produces libfs_xfs.a AND the headers beside
    # it, so there is no single path to name — A CONSUMER COPIES THE CONTENTS of
    # what this prints. A consumer that treats it as a file path will silently
    # copy the wrong thing.
    cmds:
      - 'cd "{{.OUT}}" && pwd -P'
    vars:
      OUT: 'dist'
