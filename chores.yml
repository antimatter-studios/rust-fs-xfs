version: "3"
chore_min_version: 0.10.0

# THE CONTRACT THIS FILE EXISTS TO OWN.
#
# How to build rust-fs-xfs is knowledge that belongs to rust-fs-xfs. It used to
# live in a consumer's build scripts — four of them, 757 lines between
# them, byte-identical once you normalise the driver name, of which three
# lines per script were actually about the filesystem: the cargo invocation,
# the header name and the archive name.
#
# `staticlib` is the whole interface a consumer needs, AND IT TAKES NO
# OUTPUT DIRECTORY. It builds into this crate's own dist/; `chore artifact`
# prints the absolute path of that DIRECTORY, and a consumer copies its
# contents. Nothing outside this repo should know the target triple, the
# cargo profile, or where cargo puts things — and nothing outside it
# chooses where the output lands.
#
# `artifact` PRINTS A DIRECTORY, NOT A FILE. That is the one place this
# differs from rust-blk-probe, whose single binary lets its `artifact` name
# a file: this crate produces libfs_xfs.a AND the headers beside it, so
# there is no single path to name.
#
# THE TEST CONTRACT (the fs-linux-test-harness README's "Consumer test
# contract" is the general form; rust-fs-ext4 is the other consumer):
#
#   chore siblings     check out ../rust-fs-core and ../fs-linux-test-harness
#                      at their pinned refs
#   chore tools        install and verify what the HOST needs: ripgrep, and
#                      the VM (Vagrant, QEMU, KVM/HVF). NOT xfsprogs
#   chore fixtures     build the .vm-share fixture sets — kernel-made, so in
#                      the harness VM (vm:*)
#   chore test:unit    tests that need no tool, no fixture and no VM
#   chore test:images  tests that read a fixture but need no VM
#   chore test:stress  the fsstress/fsx corpus, which `chore fixtures`
#                      does not build by default (stress.yml runs it)
#   chore test:oracle  the driver writes, xfsprogs reads back (xfs_repair -n
#                      for consistency, xfs_db for content and metadata)
#   chore test:kernel  the driver writes, THE REAL KERNEL reads back: our
#                      images loop-mounted and our log records replayed by
#                      Linux, in the guest
#   chore test:vm      the whole suite compiled and run INSIDE the guest
#   chore test         everything, exactly as CI runs it
#
# WHERE THINGS RUN, and why.
#
#   THE ORACLE TOOLS RUN IN THE GUEST, ALWAYS. xfsprogs on a workstation is
#   whatever that machine has — nothing at all on a Mac, 6.1 on Debian 12,
#   6.6 on Ubuntu 24.04, 6.13 if somebody built one under ~/.local. One
#   Debian guest, one version, the same answers everywhere. There is no
#   host path to fall back to: tests/test_contract.rs fails the suite if a
#   test runs one here.
#
#   THE KERNEL ORACLES MOUNT IN THE GUEST, ALWAYS. A loop mount needs root
#   and a kernel with XFS; this repository used to decide per host whether
#   to use `sudo -n` on the runner or the VM, which is how the branch gate
#   and a developer's run came to be judged by two different kernels. That
#   fork is gone. It is also what #211 and #212 are: a fixture built on one
#   kernel and graded on another.
#
#   THE LINUX TESTS RUN ON LINUX. On a Linux host that is this host, and
#   `chore test` compiles and runs them here. On a Mac nothing Linux-shaped
#   runs natively: `chore test` runs `test:vm` instead, which builds and
#   runs the same sources inside the guest.
#
# NOTHING SKIPS: a missing tool, fixture or VM fails the test that needed
# it, naming the task that provides it. scripts/ci-test.sh is the second
# half of that guarantee and every tier goes through it — it fails a run
# whose output matches a skip, and a run that executed fewer tests than its
# floor. Its own self-test runs in `test:scripts` (#200); it never ran at
# all before.
#
# QUIET BY DEFAULT, --verbose ON REQUEST, AND THE BUDGET IS A NUMBER.
#
#   A task prints a VERDICT: one line per tier, a final count, and the path
#   of the log holding everything else. A failure prints the excerpt.
#   `chore test -- --verbose` (or OUTPUT_BUDGET_VERBOSE=1) streams the whole run.
#
#   Nothing is thrown away: every tier's output goes to tmp/logs/<tier>.log
#   in full, including the per-call `[oracle vm]` evidence. What changed is
#   where it is read from.
#
#   Each tier carries an OUTPUT BUDGET -- a line and a byte count that fails
#   the run (exit 65) when the tier prints more than it is allowed to, told
#   apart from a failing suite by its status. A budget is set from a
#   MEASURED run and moved DELIBERATELY when a tier grows, the way the
#   executed-test floors are moved. A budget nobody can breach measures
#   nothing, and so does a budget nobody derived from anything.
#
#   THE NUMBERS BELOW ARE NOT MEASURED YET. The tiers are new: this change
#   split one `cargo test` into six selections and nothing has produced a
#   line count for them. Each is carried over from the old suite so that no
#   tier is unbounded in the meantime, and each says so where it sits. The
#   first green run on every tier is what replaces them, and that
#   replacement is a commit of its own, where lowering a budget is a
#   decision somebody took rather than a number that happened.
#
#   Why it is worth a task's while: a passing run that prints three thousand
#   lines hides the twenty that matter, and every reader pays for it --
#   a person scrolling, a CI log viewer, and an agent working here, which
#   re-reads its transcript on every step and so pays for one loud run many
#   times over. See the fs-linux-test-harness README, "Output: quiet by
#   default, --verbose on request".
vars:
  TRIPLE: aarch64-apple-darwin
  LIBNAME: fs_xfs

  # The sibling pins. One place, read by `chore siblings` and — through
  # that task — by CI. URL as well as ref: the family is not all in one
  # org, and a URL rebuilt from a repo name points at a repository that
  # does not exist for exactly the ones that are not.
  FS_CORE_URL: https://github.com/antimatter-studios/rust-fs-core.git
  # v0.2.11 is the release that packages ../rust-fs-core/scripts/output-budget.sh, which
  # ../rust-fs-core/scripts/tier.sh resolves and verifies. v0.2.10 does not
  # contain it, so this pin cannot go back below v0.2.11 while the tiers read
  # the wrapper from core. v0.3.8 carries the agent-core v5 block that
  # AGENTS.md mirrors (sync before every push; main merges through a merge
  # queue) and scripts/code-changed.sh, which the CI changes job reads.
  # v0.3.11 carries agent-core v6 (stacked pull requests, changelog.d
  # fragments, findings filed before a tracking issue closes) and the
  # changelog-check.sh that `chore lint` runs. v0.3.12 carries agent-core
  # v7 (one stack per repository) and the stack-base.sh that names its top.
  # v0.3.13 carries the features-check.sh that `chore lint` runs and the
  # features-gather.sh a release commit runs (features.d fragments).
  # v0.4.2 has `CliError::not_found`, the kind a reading verb gives a path
  # that does not exist, builds on Rust 1.89, and carries agent-core v8.
  FS_CORE_REF: v0.4.2
  LINUX_HARNESS_URL: https://github.com/antimatter-studios/fs-linux-test-harness.git
  # v0.3.0 is the release with `vm.sh session`, which the test runner runs
  # cargo through so a run gives the VM and the machine-wide slot back
  # however it ends; v0.2.0 answers it with "unknown command".
  # v0.4.0: concurrent `vm.sh up` calls of one machine wait for the boot
  # under way instead of racing it, a halt that hangs is forced, and the
  # SSH forward port is picked at boot when the configured one is taken.
  # v0.5.0: a consumer chooses its guest, `[vm] guest = "debian-13"`, which
  # the exchange-range kernel tier needs for kernel 6.12.
  # v0.5.1: that guest boots on a Linux x86_64 host, where v0.5.0's reset
  # in GRUB with no display device (fs-linux-test-harness#70).
  LINUX_HARNESS_REF: v0.5.1

# The harness's consumer tasks, as `chore vm:<task>`. OPTIONAL because the
# harness is a sibling that `chore siblings` itself checks out: without
# it this file must still load far enough to run that task. Every task
# here that needs the VM says so when the harness is absent.
#
# No `dir:` — see the harness's vm.chores.yml: its tasks must run from
# this repository's root, where fs-linux-test-harness.toml is.
includes:
  vm:
    taskfile: ../fs-linux-test-harness/vm.chores.yml
    optional: true

# THE SAFETY NET FOR A LEAKED VM, and it is the harness's now.
#
# `defer:` is still the primary teardown where a task owns a boot: it runs
# once per task, it is positional so it only registers if the thing it
# tears down was actually reached, and a `defer:` that fails FAILS AN
# OTHERWISE-GREEN TASK.
#
# What `defer:` cannot cover is a path that never reached it — a bare
# `cargo test`, which boots the VM through the test support, or a run
# killed outright (SIGKILL, a background job reaped by its harness), which
# never unwinds anything. Both happened here in one afternoon.
#
# `after_all` runs once per invocation, on success, on failure and on
# Ctrl-C, so any LATER chore invocation of any task cleans up what was
# left behind. `chore build` is enough. It fails SOFT, which is the right
# shape for a net: turning an unrelated `chore build` red because
# something else left a VM running would teach people to ignore it.
#
# And the guest still schedules its own poweroff at boot
# (deadline_minutes in fs-linux-test-harness.toml), because a timer dies
# with the process that owns it and a SIGKILL to chore defeats every
# host-side net at once. On 2026-09-07 a VM was held for THIRTEEN HOURS
# that way. Fast precise net inside, dumb unkillable net outside.
lifecycle:
  after_all:
    - '[ ! -x ../fs-linux-test-harness/scripts/vm.sh ] || ../fs-linux-test-harness/scripts/vm.sh reap'

tasks:
  siblings:
    desc: Check out the sibling repos this crate builds and tests against, at their pinned refs
    # init + fetch-by-ref rather than clone: a pin may be a bare commit,
    # which `git clone --branch` cannot name. REFUSES TO MOVE A DIRTY
    # SIBLING — a checkout is destructive to uncommitted work.
    cmds:
      - |
        set -eu
        # SIBLINGS LIVE BESIDE THE MAIN TREE, NOT BESIDE THIS CHECKOUT.
        #
        # `../$name` was resolved from wherever the task ran, and a thread worktree
        # is not next to the main checkout -- it lives under the agent's own
        # directory. Measured on 2026-09-22 the same family resolved
        # ../rust-fs-core to THREE different places: beside the main checkouts,
        # beside the ntfs worktrees, and beside a consumer's. One of those
        # was a day out of date and was winning silently for anything resolving
        # relatively.
        #
        # A sibling set is a property of the machine, not of a checkout. One copy
        # on disk is the whole point of siblings over submodules, and it holds only
        # if every checkout of every crate agrees where that copy is.
        # --git-common-dir names the main tree from a worktree AND from the main
        # checkout, so this answers the same from anywhere.
        #
        # --path-format=absolute is required, not tidiness: without it a main
        # checkout reports a bare `.git` and this resolves to `//$name`.
        common="$(git rev-parse --path-format=absolute --git-common-dir)"
        siblings_root="$(cd "$common/../.." && pwd)"
        printf '%s\t%s\t%s\n' \
          rust-fs-core          '{{.FS_CORE_URL}}'       '{{.FS_CORE_REF}}' \
          fs-linux-test-harness '{{.LINUX_HARNESS_URL}}' '{{.LINUX_HARNESS_REF}}' \
        | while IFS="$(printf '\t')" read -r name url ref; do
            dir="$siblings_root/$name"
            # -e, not -d: a worktree's .git is a FILE naming its gitdir, and every
            # working copy here is a worktree, a pinned sibling included.
            if [ ! -e "$dir/.git" ]; then
              echo "siblings: cloning $name at $ref"
              git init --quiet "$dir"
              git -C "$dir" remote add origin "$url"
              git -C "$dir" fetch --quiet origin "$ref"   # not --depth 1: merge-base needs history
              git -C "$dir" checkout --quiet FETCH_HEAD
              continue
            fi
            if [ -n "$(git -C "$dir" status --porcelain)" ]; then
              echo "siblings: $name has uncommitted changes -- refusing to move it." >&2
              exit 1
            fi
            git -C "$dir" fetch --quiet origin main "$ref"
            # THE PIN IS A FLOOR, NOT A TARGET, AND THE SIBLING STAYS ON A BRANCH.
            #
            # This used to compare HEAD with the pinned ref and check out the ref
            # whenever they differed, which had two consequences, both observed.
            #
            # It moved the checkout BACKWARDS. One copy of core is shared by every
            # crate on the machine, so the oldest pin in the family won: a sibling two
            # commits ahead was silently rewound to satisfy this repository.
            #
            # And checking out a tag DETACHES. Core was found detached and 52 commits
            # stale, four days after a `chore siblings` run put it there, because a
            # detached HEAD reads as a deliberate state and nothing complains about it.
            # On a branch, being behind shows up in `git status` the first time anyone
            # looks -- and a commit made in the sibling belongs to something.
            #
            # So: guarantee a FLOOR, and never move anyone off their branch.
            #
            # An earlier cut of this checked out main unconditionally, which is only a
            # little better than the detach it replaced. rust-fs-core was found on
            # release/v0.2.12 with an unpushed commit while a release was being cut;
            # checking out main would have taken it away mid-cut. The previous
            # revision of this task did worse to that same checkout on 2026-09-22 --
            # it rewound a shared core three weeks, to a September 6th commit.
            #
            # If the checkout already contains the pinned ref it is left exactly as it
            # is, on whatever branch that is. Only a checkout genuinely below the floor
            # is moved, and only by fast-forwarding a main that is already checked out.
            # Anything else is reported for a human, because this is one checkout
            # shared by every crate on the machine and not this task's to hijack.
            current="$(git -C "$dir" rev-parse --abbrev-ref HEAD)"
            if git -C "$dir" merge-base --is-ancestor "$ref" HEAD; then
              echo "siblings: $name at or ahead of $ref (on $current)"
            elif [ "$current" = "main" ] && git -C "$dir" merge --ff-only --quiet origin/main 2>/dev/null; then
              echo "siblings: $name fast-forwarded to $(git -C "$dir" rev-parse --short HEAD)"
            else
              echo "siblings: $name is on '$current' and below $ref; this task will not move it." >&2
              echo "          It is one checkout shared by every crate here -- move it yourself." >&2
              exit 1
            fi
          done

  tools:
    desc: "Install and verify what the HOST needs: ripgrep, and the VM the oracle tools live in"
    cmds: ['scripts/tools.sh']

  fixtures:
    desc: 'Build the .vm-share fixture sets (kernel-made, in the fs-linux-test-harness VM): chore fixtures [-- set...]'
    # Up to date while the recipes are unchanged and every set's sentinel
    # image exists; name sets to build only those
    # (`chore fixtures -- log truncate`). The VM comes down when the build
    # ends, however it ends (build-fixtures.sh sources the harness's
    # vm-session.sh).
    #
    # THE SENTINEL LIST HERE AND IN build-fixtures.sh MUST AGREE. `stress`
    # is deliberately absent from both: it builds fsstress and fsx from
    # source first and takes tens of minutes, so it is asked for by name.
    sources:
      - scripts/build-fixtures.sh
      - scripts/guest-build-fixtures.sh
      - scripts/build-*-fixtures.sh
      - scripts/fixture-geometries.sh
      - scripts/vm-setup.sh
    generates:
      - .vm-share/xfs-default.img
      - .vm-share/xfsdata-default.img
      - .vm-share/xfslog-b4096-i512.img
      - .vm-share/xfstrunc-lone-before.img
      - .vm-share/xfscreate-spare-before.img
      - .vm-share/xfsunlink-spare-before.img
      - .vm-share/xfsdirconv-exact-before.img
      - .vm-share/xfscrossag-plain.img
      - .vm-share/xfsdeep-bno2.img
      - .vm-share/xfsfeat-base.img
      - .vm-share/xfscli-v5.img
    # A hung boot must not hold the VM and the machine-wide slot for ever.
    timeout: 90m
    on_timeout:
      - cmd: '../fs-linux-test-harness/scripts/vm.sh down || ../fs-linux-test-harness/scripts/vm.sh destroy'
    cmds: ['scripts/build-fixtures.sh $CLI_ARGS']

  fixtures:clean:
    desc: Remove the built fixtures (they are regenerable, and large)
    cmds: ['rm -rf .vm-share/*.img .vm-share/*.dump .vm-share/*.sbdump .vm-share/*.inodedump .vm-share/*.manifest .vm-share/*.verdict .vm-share/*.provenance .vm-share/run']

  test:unit:
    desc: 'Tests that need no tool, no fixture and no VM: the library, the binaries, and every tests/*.rs that reaches neither'
    # In the DEBUG profile, which is the point: overflow-checks are on
    # here and off in release. tests/ci_profile.rs checks that the CI
    # workflow still runs this task in that profile.
    #
    # Which targets: scripts/test-targets.sh, derived from the tests
    # rather than listed here. CI runs this job with no fixtures present,
    # which is what proves the split.
    #
    # MEASURED in run 35435470063 on 2026-09-19: 501 lines / 32,219 bytes on
    # the Linux runner and 534 / 33,680 on Darwin, whose test names wrap
    # differently. The budget is half as much again as the larger of the
    # two — room for the tier to grow before anyone has to think about
    # it, and not so much that it stops measuring anything.
    #
    # IT DOES NOT GO THROUGH ci-test.sh's RUN MODE, and that is not an
    # exemption from the gate. That mode pins `--release` (which
    # tests/ci_profile.rs holds it to, because the workflow parser relies
    # on it), so the debug tier runs cargo itself and hands the log tier.sh
    # wrote to `ci-test.sh --gate`: the same skip pattern, the same
    # executed-test counter, one run.
    #
    # The floor was 380: 427 executed in run 35435470063 on 2026-09-19
    # (job 105877256028), less the usual margin. Raise it deliberately.
    # The public extent-size flag regression (#533) adds one unit case to
    # #517's floor of 381: 382.
    # The fsck help regression (#526) adds two more unit cases: 384.
    #
    # Budget: 828 lines / 50,167 bytes measured on rust-fs-core v0.3.8 (run
    # 38030776962), every test passing; half as much again, so 1250 lines /
    # 76,000 bytes.
    cmds:
      - 'EXPECT_OVERFLOW_CHECKS=1 ../rust-fs-core/scripts/tier.sh test:unit unit 1250 76000 -- scripts/with-test-temp.sh cargo test --locked --features cli $(scripts/test-targets.sh unit) -- --nocapture'
      # Unknown inode flag preservation adds one case (#517).
      # The fsck help regression adds two more (#526).
      - 'scripts/ci-test.sh --gate 384 tmp/logs/unit.log "the debug unit tier"'

  test:images:
    desc: 'The tests that read a fixture but need no VM — what a host without KVM can still run'
    # The tier CI's aarch64 job runs: GitHub's arm64 runners have no
    # /dev/kvm, so no VM can start there, and the oracle and kernel tiers
    # read the same images on every architecture anyway. Named as a tier
    # rather than skipped inside the tests, so what does not run there is
    # visible in the workflow rather than hidden in a green log.
    #
    # MEASURED in run 35435470063 on 2026-09-19: 567 lines / 33,542 bytes on
    # aarch64 Linux and 589 / 34,505 on Darwin; budget half as much again.
    # The floor is 90: 100 executed (job 105877826088), less the margin.
    cmds:
      - 'CI_TEST_FLOOR=90 ../rust-fs-core/scripts/tier.sh test:images images 900 52000 -- scripts/ci-test.sh $(scripts/test-targets.sh images)'

  test:stress:
    desc: 'The fsstress/fsx corpus read back — the one fixture set `chore fixtures` does not build by default'
    # NOT PART OF `chore test`, and that is the whole reason it is a tier
    # of its own. The corpus is three 500 MB filesystems generated from a
    # fixed seed on top of an fstests build: tens of minutes for a result
    # that is identical every run unless the seed, mkfs.xfs, the kernel
    # or fstests moves. .github/workflows/stress.yml builds it weekly and
    # on demand and runs this against it, so a change in any of those
    # shows up as a failure there rather than the next time somebody
    # rebuilds fixtures by hand.
    #
    # Before this tier existed the suite sat in `images`, where it
    # skipped for want of the corpus on every ordinary run. A skip is not
    # a pass, so it now fails there instead — which is what made the tier
    # necessary rather than tidy.
    #
    # BUDGET NOT MEASURED HERE, because `chore test` never runs this and
    # the pull-request gate therefore never produces a number for it.
    # .github/workflows/stress.yml is where it runs, and the measurement
    # comes from there.
    #
    # THE FLOOR IS THE WHOLE SUITE: three cases, and three is the count
    # rather than the count less a margin. A margin under a three-case
    # oracle is a floor of two, which is one silently dropped case away
    # from meaning nothing — the same reasoning dir_block_oracle's floor
    # already carries. Dropping a case here is meant to be a deliberate
    # edit to this line.
    cmds:
      - 'scripts/build-fixtures.sh --check stress'
      - 'CI_TEST_FLOOR=3 ../rust-fs-core/scripts/tier.sh test:stress stress 400 24000 -- scripts/ci-test.sh $(scripts/test-targets.sh stress)'

  test:oracle:
    desc: 'The driver writes, xfsprogs reads back — every tool call made inside the harness VM'
    # THE VM IS BROUGHT UP FOR THE TIER, not by each test binary. This
    # suite has thirty test binaries and cargo starts them together; each
    # would otherwise race the others to boot the same machine, and the
    # slot lock would serialise thirty boots that are one boot.
    #
    # Nothing HOLDS it. scripts/with-test-temp.sh runs cargo inside a
    # harness session (`vm.sh session`), so the VM comes down and the
    # machine-wide slot is released when the tier ends, however it ends and
    # however it was started — one boot for the tier. The `after_all`
    # reaper is the net for a run that never reached the session.
    #
    # MEASURED in run 35435470063 on 2026-09-19: 150 lines / 32,125 bytes —
    # few lines, long ones, because every tool call and its verdict is in
    # them. Budget double, which is where the line length makes the bytes
    # the binding half.
    # The floor is 16: 18 executed (job 105877826105), less the margin.
    # Budget: 312 lines measured with the mkfs and fsck oracle suites in the
    # tier (run 37444985503), so 330. Then 339 lines / 54,505 bytes with a
    # damage case for every checker code (#364, run 37984830147), so 400
    # lines; the bytes stay where they are. Then 417 lines / 61,093 bytes
    # with the exchange-range and repair suites (run 38488415326, the
    # tier's own log), so 500 lines / 76,000 bytes, about a fifth over.
    # MEASURED in the merge queue's runs for stack #504 on 2026-10-17 (the
    # tier's own log), every test passing: 428 lines / 81,990 bytes on the
    # #500 layer (run 38993549281) and, the largest, 430 lines / 95,092
    # bytes on the #509 layer (run 38993554195), the growth the
    # parent-pointer and attribute-block cases' `[oracle vm]` lines, each
    # an xfs_db call setting dozens of attributes. The layers above #509
    # add remote-value cases and were never measured, so the budget is
    # raised here, where the tier first exceeds it, from the largest: half
    # as much again, rounded up, is 645 lines / 143,000 bytes (#514).
    cmds:
      - scripts/tools.sh --check
      - '[ ! -x ../fs-linux-test-harness/scripts/vm.sh ] || ../fs-linux-test-harness/scripts/vm.sh up'
      - 'CI_TEST_FLOOR=16 ../rust-fs-core/scripts/tier.sh test:oracle oracle 645 143000 -- scripts/ci-test.sh $(scripts/test-targets.sh oracle)'

  test:kernel:
    desc: 'The driver writes, THE KERNEL reads back: our images mounted and our log records replayed by Linux in the guest'
    # The gap xfs_repair cannot close: a volume it calls clean can still
    # be one Linux mounts differently, and a log record it accepts can
    # still be one the kernel replays into a filesystem that no longer
    # makes sense. These tests write with the Rust API, have the guest
    # mount the result, and compare what came back.
    #
    # MEASURED in run 37765095462, job 113272789103, head b2c8b8e,
    # on 2026-10-08: all 74 tests passed; 1013 lines / 58,883 bytes.
    # The expanded matrix judges 308 pairs with zero unjudged. Retain
    # all per-pair evidence with about 10% output headroom.
    # The floor was 36: 41 executed (job 105877826105), less the margin.
    # The extent-size flag kernel oracle (#533) adds one case to the
    # stat and recursive-listing floor of 41: 42.
    # Budget: 738 lines / 51,109 bytes measured with the quota record oracle
    # in the tier (run 37791688001), every byte of its growth an `[oracle vm]`
    # line naming a tool call and its verdict; half as much again, so 1110
    # lines / 77,000 bytes.
    # MEASURED in run 37926110493 (job 113842031600, 2026-10-09), with the
    # expanded matrix and the quota record oracle together on current main:
    # every test passed and the tier printed 1,234 lines / 79,160 bytes;
    # half as much again is 1,851 lines / 119,000 bytes.
    # MEASURED in run 38393092090 (job 115295062742, 2026-10-13), with the repair
    # stack's kernel suites (#431): all 147 tests passed and the tier printed
    # 1,836 lines / 153,861 bytes, its growth the repairs' `[kernel vm]` and
    # `[oracle vm]` evidence; half as much again is 2,754 lines / 230,800
    # bytes.
    cmds:
      - scripts/tools.sh --check
      - 'scripts/build-fixtures.sh --check'
      - '[ ! -x ../fs-linux-test-harness/scripts/vm.sh ] || ../fs-linux-test-harness/scripts/vm.sh up'
      # cli_stat_kernel adds three cases to the existing floor (#517).
      # Recursive listing adds two kernel-find cases to that floor, and
      # cli_rm_kernel two more (#519).
      # cli_ln_kernel adds two link and format-limit cases (#521), and
      # cli_mv_kernel two more (#520).
      # mkdir --parents adds one Linux-twin case (#522).
      # cli_truncate_kernel adds two length and shared-tail cases (#523).
      # xattr inspection adds one all-forks kernel/getfattr case (#525).
      # cli_pwrite_kernel adds one (#524), cli_export_kernel one (#529),
      # cli_import_kernel three (#530) and one more for links and times (#531).
      - 'CI_TEST_FLOOR=58 ../rust-fs-core/scripts/tier.sh test:kernel kernel 2754 230800 -- scripts/ci-test.sh $(scripts/test-targets.sh kernel)'

  test:kernel-new:
    desc: 'The kernel tier on the Debian 13 guest: kernel 6.12 reads back what 6.1 cannot mount (parent pointers, exchange-range)'
    # A SECOND GUEST, NOT A SECOND SUITE. Everything else boots Debian 12,
    # whose 6.1 kernel refuses the parent-pointer and exchange-range bits at
    # mount, so it can neither replay this driver's log on such a volume nor
    # read it back. fs-linux-test-harness.debian-13.toml is this repository's
    # config with its own machine name and SSH port and `[vm] guest =
    # "debian-13"`; FLTH_CONFIG points the harness at it, and the suites in
    # scripts/test-targets.sh's NEW_KERNEL_SUITES run there and nowhere else.
    #
    # Budget: 53 lines / 1,900 bytes measured with exchange_range_kernel
    # alone (#374), on an aarch64 Linux host; half as much again, rounded up,
    # so 80 lines / 3,000 bytes. On the x86_64 CI runner, cold, the same
    # suite printed 103 lines / 4,715 bytes (run 38488415326, the tier's own
    # log): a line per crate compiled. Half as much again of that, so 155
    # lines / 7,100 bytes. The floor is 2: both replay tests passed in
    # run 38579919181, job 115907655076, head d245576 (2026-10-14).
    # That kernel-new log measured 22 lines / 1,190 bytes; the budget stays.
    cmds:
      - scripts/tools.sh --check
      - 'FLTH_CONFIG="$PWD/fs-linux-test-harness.debian-13.toml" ../fs-linux-test-harness/scripts/vm.sh up'
      - 'FLTH_CONFIG="$PWD/fs-linux-test-harness.debian-13.toml" CI_TEST_FLOOR=2 ../rust-fs-core/scripts/tier.sh test:kernel-new kernel-new 155 7100 -- scripts/ci-test.sh $(scripts/test-targets.sh kernel-new)'

  test:vm:
    desc: 'The whole suite, compiled and run INSIDE the harness VM (how a Mac runs the Linux tests)'
    # scripts/guest-suite.sh, through the harness's [test] guest_command.
    # The toolchain and the build directory live on the VM's own disk, so
    # the first run pays a full build and later runs are incremental.
    # FLTH_KEEP_VM=1 keeps the VM up for the next one.
    #
    # MEASURED in run 35435470063 on 2026-09-19 (job 105877826117), which
    # is a FIRST run: the guest build's per-crate lines are part of what
    # it has to fit. 1,801 lines / 127,393 bytes; the line budget is half
    # as much again and the byte budget is left where it was, because the
    # guest build's lines are long and the bytes are the binding half.
    # The floor was 525: 586 executed, less the usual margin.
    # The extent-size regressions (#533) add one unit and one kernel case,
    # both included in this guest selection, to the previous floor of 527: 529.
    # Two rm/rmdir cases (#519) and two fsck help cases (#526) make it 533.
    # The two ln kernel cases (#521) make it 535, and two mv cases (#520) 537.
    # One mkdir --parents case (#522) and two truncate cases (#523) make it 540.
    # The write --at kernel case (#524) makes it 541, and the export case (#529) 542, and the import cases (#530) 545, and links and times (#531) 546.
    timeout: 150m
    on_timeout:
      - cmd: '../fs-linux-test-harness/scripts/vm.sh down || ../fs-linux-test-harness/scripts/vm.sh destroy'
    cmds:
      # The sibling crates this one builds against are staged on the
      # share first: the guest is given THIS repository, not the
      # directory that holds it, so a path dependency on ../rust-fs-core
      # has nothing to resolve to until it is put there. From the pinned
      # checkout's HEAD, so what the guest builds against is what
      # `chore siblings` pinned and nothing uncommitted.
      - |
        set -eu
        [ -x ../fs-linux-test-harness/scripts/vm.sh ] || {
          echo "test:vm needs the harness sibling -- run 'chore siblings'." >&2
          exit 1
        }
        share="$(../fs-linux-test-harness/scripts/vm.sh share)"
        for sibling in rust-fs-core; do
          [ -e "../$sibling/.git" ] || {
            echo "test:vm: ../$sibling is not checked out -- run 'chore siblings'." >&2
            exit 1
          }
          dest="$share/siblings/$sibling"
          rm -rf "$dest"
          mkdir -p "$dest"
          git -C "../$sibling" archive --format=tar HEAD | tar -x -C "$dest"
        done
        # --verbose is ours, not cargo's: tier.sh reads it out of CLI_ARGS
        # and streams, and it must not also reach the in-guest `cargo
        # test`, where it would mean something else entirely.
        guest_args=""
        for arg in ${CLI_ARGS:-}; do
          case "$arg" in --verbose|-v) continue ;; esac
          guest_args="$guest_args $arg"
        done
        # MEASURED on 2026-10-09 as the suites under review added their
        # oracles: every test passed in the guest, which printed 2,607 lines
        # (run 37952408330) and, the largest, 3,134 lines / 218,235 bytes
        # (run 37944786229, job 113899115614). Half as much again as the
        # largest is 4,701 lines / 328,000 bytes.
        # MEASURED in run 37944786229 (job 113899115614, 2026-10-09), with
        # the expanded feature matrix in the guest suite: every test passed
        # and it printed 3,134 lines / 218,235 bytes; half as much again is
        # 4,701 lines / 328,000 bytes.
        # MEASURED in the merge queue's runs for stack #504 on 2026-10-17,
        # every test passing in the guest: 4,196 lines / 326,919 bytes on
        # the #500 layer (run 38993549281), inside the budget, and 4,209
        # lines / 340,840 bytes on the #509 layer (run 38993554195), over
        # it. The layers above #509 were never measured. The budget is
        # raised in the #500 layer rather than #509's, beside the oracle
        # tier's, so that one change carries both: half as much again as
        # the largest, rounded up, is 6,314 lines / 512,000 bytes (#514).
        # shellcheck disable=SC2086  # the words are the point
        # Recursive listing adds two kernel-find cases to the previous floor,
        # and cli_rm_kernel two more (#519).
        # The fsck help regression adds two more (#526), the ln kernel cases
        # two more (#521), and cli_mv_kernel two more (#520).
        # mkdir --parents adds one Linux-twin case (#522).
        # cli_truncate_kernel adds two length and shared-tail cases (#523).
        # xattr inspection adds one all-forks kernel/getfattr case (#525).
        # cli_pwrite_kernel adds one (#524), cli_export_kernel one (#529),
        # cli_import_kernel three (#530) and one more for links and times (#531).
        CI_TEST_FLOOR=547 ../rust-fs-core/scripts/tier.sh test:vm vm 6314 512000 -- \
          ../fs-linux-test-harness/scripts/vm.sh guest-test $guest_args

  test:scripts:
    desc: The shell tests (tests/scripts/*.sh), every one by glob
    # By glob, so a test added later needs no edit here -- a guard that
    # has to be registered somewhere else is a guard that gets silently
    # skipped. That is exactly how ci-test.sh's own --self-test went
    # unrun from the day it was written (#200) until it was moved here.
    #
    # MEASURED, 2026-09-18, on this arm64 host: 20 lines / 1,062 bytes
    # across five shell tests. The budget is double that — a shell test
    # prints about four lines, so it is room for five more before anybody
    # has to think about it.
    #
    # 34 lines / 1,896 bytes across twelve on 2026-09-29 (arm64 macOS), with
    # the packaging and cli-tier guards (#271): inside the budget, which is
    # not raised, and nearer it than it was.
    #
    # MEASURED, 2026-10-08, on arm64 macOS: 48 lines / 2,815 bytes across
    # fifteen shell tests, including the two feature-matrix guards (#359).
    # Full output: tmp/logs/359-scripts-budget-red.log. The budget is half
    # as much again, with bytes rounded up to the next hundred.
    cmds:
      - |
        set -eu
        bash ../rust-fs-core/scripts/tier.sh test:scripts scripts 72 4300 -- bash -c '
          set -eu
          for t in tests/scripts/*.sh; do
            echo "== $t"
            bash "$t"
          done
        '

  test:
    desc: 'Everything, exactly as CI runs it — natively on Linux, inside the VM anywhere else'
    # WE RUN THE LINUX TESTS ON LINUX. This host is Linux, so they run
    # here; on a Mac there is no XFS, no loop mount and no xfsprogs at
    # all, so the same sources are built and run inside the guest instead
    # (`test:vm`). Not a reduced run and not a skip: the whole suite, one
    # Linux away.
    cmds:
      - |
        set -eu
        # --verbose belongs to the whole run, and test:native's tiers are
        # separate chore invocations: an exported variable is what reaches
        # them, which is why tier.sh reads OUTPUT_BUDGET_VERBOSE as well as the flag.
        case " ${CLI_ARGS:-} " in
          *" --verbose "*|*" -v "*) export OUTPUT_BUDGET_VERBOSE=1 ;;
        esac
        if [ "$(uname -s)" != Linux ]; then
          echo "test: this host is $(uname -s) -- running the Linux suite in the harness VM."
          exec "{{.CHORE_EXE}}" test:vm
        fi
        "{{.CHORE_EXE}}" test:native

  test:native:
    desc: 'The suite on this (Linux) host: unit (debug), the fixture-readers, the oracles, the kernel oracles, everything (release), the scripts'
    # Checks for the host tools and the fixtures FIRST and fails naming
    # the task that provides them, rather than letting several hundred
    # tests each fail on the same missing image.
    #
    # test:oracle and test:kernel run before the release pass, which runs
    # what they did not: the unit suites again in release, and the fixture
    # readers (`scripts/test-targets.sh rest`). It used to be the whole
    # suite and run every oracle and kernel suite a second time, both
    # times in release: about 20 of an x86_64 job's 55 minutes, and paid
    # again by the merge queue's run (#437). Every suite still runs once
    # in `test`; the in-guest suite (scripts/guest-suite.sh) still runs
    # `all`, because it is the only pass there.
    #
    # MEASURED in run 35435470063 on 2026-09-19 (job 105877826105): the
    # release pass printed 1,656 lines / 122,595 bytes; budget half as
    # much again. The floor was 525: 586 executed, less the usual margin.
    # The public extent-size flag regression (#533) adds one unit case to
    # this remaining selection: 526; its kernel oracle runs in test:kernel.
    # The fsck help regression (#526) adds two more unit cases: 528.
    # MEASURED again on 2026-10-09, as the checker, repair and write suites
    # under review added their oracles: every test passed in each run, and
    # the release pass printed 180,953 bytes (run 37933633035), 181,575
    # (37934328714), 181,833 (37918336667) and, the largest, 2,374 lines /
    # 187,377 bytes (run 37918532099, job 113803432673). Half as much again
    # as the largest is 3,561 lines / 282,000 bytes.
    # MEASURED again in run 37918532099 (job 113803432673, 2026-10-09),
    # with the attribute-write oracles in the suite: every test passed and
    # the release pass printed 2,374 lines / 187,377 bytes; half as much
    # again is 3,561 lines / 282,000 bytes.
    # MEASURED once the pass ran only the rest (#437), in run 38127233977
    # on 2026-10-11 (job 114435727147): 1,540 lines / 97,977 bytes, every
    # test passing, and the x86_64 job took 47 minutes where #449's, the
    # run before, took 96. Half as much again is 2,310 lines / 147,000
    # bytes.
    timeout: 120m
    on_timeout:
      - cmd: 'echo "timeout: reclaiming the harness VM (spent $TIMEOUT)"'
      - cmd: '../fs-linux-test-harness/scripts/vm.sh down || true'
      - cmd: 'for g in $TIMEOUT_PGID; do kill -TERM -"$g" 2>/dev/null || true; done'
    cmds:
      - task: test:unit
      - scripts/tools.sh --check
      - 'scripts/build-fixtures.sh --check'
      - task: test:oracle
      - task: test:kernel
      - '[ ! -x ../fs-linux-test-harness/scripts/vm.sh ] || ../fs-linux-test-harness/scripts/vm.sh up'
      - 'CI_TEST_FLOOR=528 ../rust-fs-core/scripts/tier.sh "test:native (the rest, release)" suite 2310 147000 -- scripts/ci-test.sh $(scripts/test-targets.sh rest)'
      - task: test:scripts
      # The command-line tools, built and staged the way an install lays
      # them out, then tested as installed: found on PATH, doctor first.
      # A separate invocation because test:cli reads PATH, and the staged
      # directory has to be first on it.
      - task: cli:install
      - 'PATH="$(scripts/cli-install.sh --print-bin-dir):$PATH" "{{.CHORE_EXE}}" test:cli'
      # THE LAST LINE: one number across the tiers, and where the detail is.
      - scripts/test-verdict.sh unit oracle kernel suite cli

  cli:install:
    desc: 'Build the command-line tools (release, --features cli) and stage them as an install prefix: tmp/cli/bin under every name, tmp/cli/share the man pages and completions'
    # The layout an install has: the multi-call binary as rust-fs-xfs and
    # each dotted name a relative symlink to it. It prints the PATH line;
    # `test:cli` tests whatever PATH finds, so that directory goes first.
    cmds: ['scripts/cli-install.sh']

  test:cli:
    desc: 'The command-line tools AS INSTALLED, found on PATH: doctor first, then every tests/cli/test-*.sh'
    # Tests the installed artifact, not a cargo target: the same suite
    # checks `chore cli:install`'s staging (test:native puts it first on
    # PATH) and a Homebrew install. `rust-fs-xfs doctor` runs before any
    # tool is tested and fails the tier if a name is missing or shadowed,
    # naming the fix. See scripts/test-cli.sh.
    #
    # NO VM. The images are kernel-made fixtures (the `cli` set), read
    # from .vm-share; what xfsprogs and the kernel make of the tools'
    # output is judged in the oracle and kernel tiers
    # (tests/cli_*_oracle.rs, tests/cli_*_kernel.rs). So this tier runs
    # anywhere the fixtures are, a Mac included.
    #
    # THE FLOOR: each file prints a `test result: ok. N passed` line, which
    # `ci-test.sh --gate` sums as it does cargo's, and the same gate fails
    # a log that says anything skipped. 83 checks executed when the tier
    # was added (#271, arm64 macOS), 588 with fs.xfs's read verbs, 692 with
    # the write verbs, 721 with the man pages and completions; the floor is
    # about 95% of that.
    #
    # MEASURED on the same runs: 11 lines / 390 bytes, then 14 / 470, then
    # 17 / 552, then 20 / 631. Every
    # file is three lines when it passes and every tool a doctor line, so a
    # new file is a visible step. Budget half as much again, with room in
    # the bytes for a runner's longer checkout path in the doctor lines.
    # Measured at 1001 bytes once every version line names rust-fs-xfs
    # (run 37444985503), so 1200.
    #
    # 32 lines with test-stat.sh (#517) and test-ls-recursive.sh, in the
    # merge-queue run 39085982433, over the old budget of 30; the bytes
    # stayed under 1,200, since that run named only the lines as over.
    # About 30% over that is 42 lines and 1,550 bytes.
    #
    # 26 lines / 1,001 bytes on main in run 39016952853, with five files.
    # test-stat.sh (#517), test-ls-recursive.sh, test-ln.sh (#521) and
    # test-mv.sh (#520) add three lines each, at most 95 bytes a file:
    # 38 lines / 1,326 bytes. Half as much again is 57 lines / 2,000 bytes.
    # test-write-at.sh (#524) adds three more: 41 lines / 1,421 bytes, inside it.
    cmds:
      - 'scripts/build-fixtures.sh --check cli'
      - '../rust-fs-core/scripts/tier.sh test:cli cli 57 2000 -- scripts/test-cli.sh'
      # test-stat.sh adds 28 checks to the existing floor (#517).
      # Recursive listing adds 89 assertions to that floor; rm and rmdir
      # add 108 in test-write.sh and 4 in test-docs.sh (#519).
      # ln adds 104 assertions and two generated-document checks (#521).
      # mv adds 150 in test-mv.sh and 2 in test-docs.sh (#520).
      # test-mkdir.sh adds 56 assertions (#522), counted from its checks.
      # truncate adds 90 assertions and two generated-document checks (#523).
      # test-xattr.sh adds 33 assertions and its generated man pages add 2 (#525).
      # write --at adds 163 in test-write-at.sh (#524).
      # export adds 975 in test-export.sh and 2 in test-docs.sh (#529).
      # import adds 56 in test-import.sh and 2 in test-docs.sh (#530).
      # --preserve=times,links adds 14 in test-import-preserve.sh (#531).
      - 'scripts/ci-test.sh --gate 2567 tmp/logs/cli.log "the cli tier"'

  staticlib:
    desc: Build the static library and its headers into this crate's dist/
    # NO `out` ARGUMENT, deliberately. A library does not write into its
    # consumer. It builds into its own dist/ and a consumer asks where that
    # is — `chore artifact` prints the path. Inverting it that way means this
    # crate can change its output layout without every consumer knowing, and
    # it stays independently usable with no consumer at all.
    vars:
      OUT: 'dist'

    # Freshness, replacing the 101 lines of stamp-file and mtime comparison
    # the old scripts carried. Content checksums, so touching a file does not
    # trigger a rebuild and reverting one does not hide behind a newer mtime.
    #
    # These patterns are LITERAL on purpose. chore records a fingerprint by
    # calling fingerprint.Save WITHOUT a renderer (internal/run/run.go:313),
    # so a pattern containing {{ }} is expanded against the raw text, matches
    # nothing, and stores the empty-set hash — the task then never registers
    # as up to date. Measured 2026-08-27 against chore 0.6.0.
    sources:
      - Cargo.toml
      - 'src/**/*.rs'
      - 'include/*.h'
      # fs_core.h is a source of ours because we ship it (see the cp below).
      # THIS PATH AND THE cp MUST AGREE, and nothing checks that they do —
      # it is the same path Cargo.toml resolves rust-fs-core from.
      - '../rust-fs-core/include/fs_core.h'

    # Templated, which is fine here where it is not fine above: the check
    # renders these correctly, and every entry is an exact path rather than a
    # glob, so a missing artifact is caught by the pattern failing to match.
    generates:
      - '{{.OUT}}/lib{{.LIBNAME}}.a'
      - '{{.OUT}}/include/{{.LIBNAME}}.h'

    cmds:
      # Idempotent, and it replaces a 25-line "is the target installed" dance:
      # rustup answers "up to date" without touching the network when it is.
      # It runs here rather than in the consumer because the triple is ours.
      - 'rustup target add {{.TRIPLE}}'
      - 'cargo build --release --target {{.TRIPLE}}'
      - 'mkdir -p "{{.OUT}}/include"'
      - 'cp target/{{.TRIPLE}}/release/lib{{.LIBNAME}}.a "{{.OUT}}/lib{{.LIBNAME}}.a"'
      - 'cp include/{{.LIBNAME}}.h "{{.OUT}}/include/{{.LIBNAME}}.h"'
      # Shipping fs_core.h is ours: the header we emit #includes it, so a
      # consumer handed only fs_xfs.h cannot compile.
      - 'cp "../rust-fs-core/include/fs_core.h" "{{.OUT}}/include/fs_core.h"'

  lint:
    desc: Formatting, clippy and current lockfiles, exactly as CI runs them
    cmds:
      - bash ../rust-fs-core/scripts/agents-core-check.sh
      - bash ../rust-fs-core/scripts/changelog-check.sh
      - bash ../rust-fs-core/scripts/features-check.sh
      - bash ../rust-fs-core/scripts/ci-gate.sh
      # The family scripts are rust-fs-core's alone: fails on a committed copy,
      # or a call to a local copy.
      - bash ../rust-fs-core/scripts/family-check.sh
      - cargo fmt --check
      # `--features cli`: the command-line tools' target requires it, and
      # clippy silently leaves out a target whose features are off.
      - cargo clippy --locked --all-targets --features cli -- -D warnings
      # The fuzz targets are a workspace of their own (`exclude = ["fuzz"]`)
      # with a lockfile of their own, and nothing a pull request ran resolved
      # it: --locked above holds only the root one. A release bumped the
      # crate's version, fuzz/Cargo.lock kept the old one, and only the
      # nightly fuzz run found out, after the merge (#491). Resolving builds
      # nothing, so it needs no nightly and no cargo-fuzz.
      - cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null

  build:
    desc: Debug build
    cmds: ['cargo build']

  clean:
    desc: Remove this crate's cargo output
    cmds: ['cargo clean']

  artifact:
    desc: Print the absolute path of the directory holding the built outputs
    # `silent: true` is what makes this usable as a VALUE — without it chore
    # echoes each command and a caller capturing stdout gets the echo too.
    # PATTERNS.md: "a value — a flag string, a container status, a path" is a
    # task called through {{.CHORE_EXE}}.
    silent: true
    # NO `deps: [staticlib]`. chore prints "task: staticlib is up to date" on
    # STDOUT, which a caller capturing this as a value receives as PART OF THE
    # VALUE — measured on rust-blk-probe, where the capture came back as two
    # lines and the caller's path check failed. A value-returning task returns
    # a value and does nothing else; the caller builds first, then asks. Two
    # calls, on purpose.
    #
    # IT PRINTS A DIRECTORY, NOT A FILE, and that is the one place this differs
    # from rust-blk-probe's `artifact`. That crate produces a single binary, so
    # it can name a file. This one produces libfs_xfs.a AND the headers beside
    # it, so there is no single path to name — A CONSUMER COPIES THE CONTENTS of
    # what this prints. A consumer that treats it as a file path will silently
    # copy the wrong thing.
    cmds:
      - 'cd "{{.OUT}}" && pwd -P'
    vars:
      OUT: 'dist'

  check:semver:
    desc: Refuse a public-API break the version in Cargo.toml does not declare
    # Against the newest version on crates.io, with cargo-semver-checks: a
    # break needs the 0.x minor to move, an addition the patch. Why, and what
    # it cannot see, is at the top of the script. No `sources:` on purpose --
    # the baseline is the registry, which moves without this tree changing,
    # so a fingerprint would call a stale answer up to date.
    #
    # THE BUDGET is rust-fs-ext4's measurement of the same script: 11 lines /
    # 489 bytes passing with the baseline's rustdoc cached, one line more when
    # it is built. Its lines are fixed, not per item, so 40 / 4,000 leaves
    # room for a warning block without hiding a flood. No floor: it is one
    # check, not a suite.
    cmds:
      - '../rust-fs-core/scripts/tier.sh semver semver 40 4000 -- bash ../rust-fs-core/scripts/semver-check.sh'

  check:ci-gate:
    desc: The one required check stands for every job in ci.yml
    # A chore task naming a script, and nothing else -- the script is what can
    # be tested, reviewed and run without chore at all. This was
    # tests/ci_aggregate_gate.rs, which parsed a YAML file and compared
    # strings, and as a cargo test counted towards the executed-test floor the
    # gate itself enforces.
    cmds:
      - bash ../rust-fs-core/scripts/ci-gate.sh
