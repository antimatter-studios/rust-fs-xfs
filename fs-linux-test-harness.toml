# fs-linux-test-harness consumer config (see ../fs-linux-test-harness/README.md).
#
# EVERYTHING THAT IS LINUX HAPPENS IN HERE. The fixtures, which need the
# real kernel's XFS driver to populate them; every oracle tool (mkfs.xfs,
# xfs_db, xfs_repair, xfs_logprint, xfs_io), because xfsprogs on a
# workstation is whatever that machine has and on a Mac is not the
# platform these images are for; the kernel oracles, which loop-mount our
# images and replay our log records; and, on a host that is not Linux,
# the suite itself (`chore test:vm`).
#
# This replaces thirteen VM scripts of our own — scripts/vm.sh,
# vm-slot.sh, vm-session.sh and ten vm-build-*-fixtures.sh wrappers. The
# harness's slot lock is the reconciliation of ours with two others: it
# fixes the age-based break that let two VMs run at once, the release
# that treated an unreadable status as "not mine", and the loose owner
# match.

[project]
name = "rust-fs-xfs"

[setup]
# Runs as root INSIDE the VM; installs xfsprogs, attr/acl and the
# toolchain the in-guest suite builds with.
script = "scripts/vm-setup.sh"

[test]
# Runs INSIDE the guest, from /repo (this repository, mounted there).
guest_command = "scripts/guest-suite.sh"

[share]
# The name this repository has always used, and the tests still resolve
# fixtures through it: `common::share()` is <repo>/.vm-share on the host
# and /share in the guest, exactly as before.
dir = ".vm-share"

[vm]
# EIGHT HOURS on the deadline, not two: the whole suite on a loaded
# arm64 host runs well past an hour, and the guest's own poweroff does
# not care what is using it — a VM pulled out from under a running suite
# leaves every call it was serving with nothing to answer. The deadline
# is still what stops a VM nobody cleaned up; it just has to outlast a
# test run.
#
# THIRTY-TWO GIGABYTES OF DISK, which is more than the other consumers
# ask for: the stress fixtures are multi-GiB filesystems built by
# fsstress and fsx, and the feature matrix builds eleven geometries of
# 400 MiB each before any of them is copied out.
memory = "4G"
cpus = 4
disk = "32G"
ssh_port = 50122
deadline_minutes = 480
