name: stress corpus

# The stress fixtures are not built per pull request, deliberately.
#
# Three 500 MB filesystems, generated by fsstress and fsx from a fixed
# seed, plus the fstests build the generators come from. That is minutes
# of work whose result is identical every time unless the seed or the
# tooling moves -- so running it on every push would spend a lot to
# re-derive the same corpus.
#
# It runs on demand, and weekly so a change in mkfs.xfs, the kernel or
# fstests shows up as a failure here rather than the next time somebody
# rebuilds the fixtures by hand.
#
# IT BUILDS THEM WHERE EVERY OTHER FIXTURE IS BUILT: in the
# fs-linux-test-harness VM, through `chore fixtures -- stress`. This
# workflow used to install xfsprogs on the runner and build fsstress and
# fsx there, which meant the weekly corpus was made by one kernel and
# read back by the tests under another — the drift #211 and #212 are
# both instances of. The guest builds the generators from source
# (scripts/guest-stress-tools.sh) the first time this set is asked for.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CHORE_VERSION: "0.11.0"

jobs:
  stress:
    name: read back what fsstress and fsx wrote
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install chore
        run: scripts/ci-install-chore.sh

      - name: chore siblings
        run: chore siblings

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: KVM, QEMU and Vagrant
        id: vm-host
        run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh

      - name: Cache the Vagrant box
        uses: actions/cache@v4
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}

      # The stress corpus itself, plus the geometry and log sets the
      # suites below also read. `stress` is not part of `chore fixtures`
      # with no arguments, for the reason at the top of this file.
      - name: Build the corpus in the harness VM
        run: chore fixtures -- geometry log stress

      # Every fixture records what xfs_repair made of it. A generator can
      # trip over a kernel bug and leave a genuinely broken filesystem,
      # and that must be rejected here rather than blamed on the driver.
      - name: Refuse a corpus the checker calls broken
        run: |
          set -euo pipefail
          shopt -s nullglob
          verdicts=(.vm-share/xfsstress-*.verdict)
          [ "${#verdicts[@]}" -gt 0 ] || { echo "::error::the corpus produced no verdicts"; exit 1; }
          for v in "${verdicts[@]}"; do
            printf '%-40s %s\n' "$(basename "$v")" "$(cat "$v")"
            [ "$(cat "$v")" = SOUND ] || { echo "::error::$(basename "$v") is not SOUND"; exit 1; }
          done

      # ci-test.sh fails the job on a skip and on a run that executed
      # fewer tests than its floor, which matters most here: the whole
      # point of this workflow is that these fixtures exist, so a test
      # that cannot find one has nothing to say and must not pass.
      #
      # The corpus reaches parts of the reader the hand-built fixtures do
      # not, so a suite that walks every image is worth running against
      # it too. This is where the bmbt addressing bug showed up: a real
      # file lands in a later allocation group and a hand-written one
      # does not.
      #
      # log_dinode_oracle only, and not endtoend_oracle, which wants the
      # xfsdata-* fixtures this workflow has no reason to build.
      - name: Read the corpus back
        run: |
          set -euo pipefail
          ../fs-linux-test-harness/scripts/vm.sh up
          ./scripts/ci-test.sh --test stress_oracle
          ./scripts/ci-test.sh --test log_dinode_oracle

      - name: chore vm:status (the VM is down again)
        if: always()
        run: chore vm:reap && ! chore vm:status
