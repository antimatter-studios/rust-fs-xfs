name: stress corpus

# The stress fixtures are not built per pull request, deliberately.
#
# Three 500 MB filesystems, generated by fsstress and fsx from a fixed
# seed, plus the fstests build the generators come from. That is minutes
# of work whose result is identical every time unless the seed or the
# tooling moves -- so running it on every push would spend a lot to
# re-derive the same corpus.
#
# It runs on demand, and weekly so a change in mkfs.xfs, the kernel or
# fstests shows up as a failure here rather than the next time somebody
# rebuilds the fixtures by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

env:
  CARGO_TERM_COLOR: always
  FS_CORE_REF: v0.2.4
  CARGO_INCREMENTAL: 0

jobs:
  stress:
    name: read back what fsstress and fsx wrote
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Clone sibling rust-fs-core
        run: git clone --depth 1 --branch "$FS_CORE_REF" https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      # xfsprogs makes and checks the filesystems; e2fsprogs supplies
      # filefrag, which is where the extent counts in each fixture's
      # .provenance come from.
      - name: Install xfsprogs and e2fsprogs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xfsprogs e2fsprogs
          mkfs.xfs -V

      # The same script the oracle VM provisions with -- plain apt and
      # make, so a runner takes it unchanged. fstests is GPL-2.0 and its
      # binaries are executed, nothing from it is copied into this
      # repository; see the note in build-stress-fixtures.sh.
      - name: Build fsstress and fsx
        run: sudo bash tests/vagrant/debian/provision-stress-tools.sh

      - name: Build the corpus
        run: ./scripts/build-stress-fixtures.sh

      # Every fixture records what xfs_repair made of it. A generator can
      # trip over a kernel bug and leave a genuinely broken filesystem,
      # and that must be rejected here rather than blamed on the driver.
      - name: Refuse a corpus the checker calls broken
        run: |
          set -euo pipefail
          for v in .vm-share/xfsstress-*.verdict; do
            printf '%-40s %s\n' "$(basename "$v")" "$(cat "$v")"
            [ "$(cat "$v")" = SOUND ] || { echo "::error::$(basename "$v") is not SOUND"; exit 1; }
          done

      # ci-test.sh fails the job on a skip, which matters most here: the
      # whole point of this workflow is that these fixtures exist, so a
      # test that cannot find one has nothing to say and must not pass.
      - name: Read the corpus back
        run: ./scripts/ci-test.sh --test stress_oracle

      # The corpus reaches parts of the reader the hand-built fixtures do
      # not, so a suite that walks every image is worth running against
      # it too. This is where the bmbt addressing bug showed up: a real
      # file lands in a later allocation group and a hand-written one
      # does not.
      #
      # log_dinode_oracle only, and not endtoend_oracle, which wants the
      # xfsdata-* fixtures this workflow has no reason to build. Adding
      # it was my own over-reach and the skip check caught it.
      - name: Reproduce every logged inode core from the corpus
        run: ./scripts/ci-test.sh --test log_dinode_oracle
