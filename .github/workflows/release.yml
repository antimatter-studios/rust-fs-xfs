name: release

# Publishing runs only for a version tag, and only after the same gate
# that guards the branch.
#
# This workflow deliberately owns almost nothing. It used to carry its
# own copy of the full test and kernel-validation gate — roughly 150
# duplicated lines — and the two copies drifted three separate times:
# the release gate lost the root-inode dumps its own test required, then
# the dmesg allowlist, then the shared fixture builder. Each time the
# release gate was quietly checking less than the branch gate while still
# reporting green, which is worse than having no release gate at all.
#
# So it calls ci.yml instead. There is now exactly one definition of what
# "this driver is validated" means, and it cannot drift from itself.
on:
  push:
    tags: ['v*']

jobs:
  # Cheap and release-specific: a tag that disagrees with Cargo.toml
  # would publish a version nobody asked for, and a version number taken
  # by mistake cannot be reclaimed.
  verify-tag:
    name: verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: compare tag against the manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = //; s/"//g')"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "tag and Cargo.toml agree on $version"

  # The whole branch gate, unmodified: fmt, clippy, the test suite, and
  # the real-kernel cross-validation against xfs_db and the in-kernel XFS
  # driver.
  gate:
    name: branch gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to crates.io
    needs: [verify-tag, gate]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1

      # Clone the sibling repo that satisfies the am-fs-core path
      # dependency. `cargo publish` rewrites the path into its registry
      # equivalent, but the manifest still has to resolve locally first.
      - name: clone am-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch v0.2.2 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core

      # A version already on crates.io cannot be published again, and a
      # re-tag — or a first release published by hand before trusted
      # publishing could be configured — would otherwise fail this job
      # every time. Skip instead, so the workflow is idempotent and a red
      # run means something actually went wrong.
      - name: skip if this version is already on crates.io
        id: already
        shell: bash
        run: |
          set -euo pipefail
          name="$(grep -m1 '^name = ' Cargo.toml | sed 's/name = //; s/"//g')"
          version="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = //; s/"//g')"
          if curl -sf "https://crates.io/api/v1/crates/$name/$version" \
               -H 'User-Agent: release-workflow' >/dev/null 2>&1; then
            echo "$name $version is already published; nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "$name $version is not on crates.io; publishing."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1.0.4
        if: steps.already.outputs.published == 'false'
        id: auth

      - name: cargo publish
        if: steps.already.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # No `--locked`: publish must rewrite the am-fs-core path
        # dependency into its registry equivalent in the packaged
        # lockfile, which `--locked` forbids. The verify build resolves
        # am-fs-core from crates.io through the `version` constraint, so
        # the published artifact is pinned by that constraint rather than
        # by the local path checkout.
        run: cargo publish
